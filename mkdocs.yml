site_name: Stagecoach
site_description: A project-owned workflow for coding agents, checked at every stage.
site_url: https://MarkoArsov.github.io/agent-workflow/
repo_url: https://github.com/MarkoArsov/agent-workflow
repo_name: GitHub
edit_uri: edit/main/docs/
theme:
  name: null
  locale: en
  search_index_only: true
  custom_dir: templates/site
extra_css:
  - assets/css/tokens.css?v=stagecoach-1
  - assets/css/base.css?v=stagecoach-1
  - assets/css/layout.css?v=stagecoach-1
  - assets/css/components.css?v=stagecoach-1
  - assets/css/home.css?v=stagecoach-1
extra_javascript:
  - assets/js/site.js?v=stagecoach-1
  - assets/js/search.js?v=stagecoach-1
extra:
  asset_version: stagecoach-1
markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: false
plugins:
  - search
hooks:
  - scripts/docs_hook.py
validation:
  nav:
    omitted_files: warn
  links:
    not_found: warn
    anchors: warn
nav:
  - Start:
      - Overview: index.md
      - Install: install.md
      - Set up: setup.md
      - Update & remove: lifecycle.md
  - Use:
      - Task lifecycle: tasks.md
      - Review & delivery: review.md
      - Skills: generated/skills.md
  - Configure:
      - Project layout: projects.md
      - Commands & permissions: execution.md
      - Test environments: environments.md
      - Profile reference: profile.md
  - Customize:
      - Skills & stages: customize.md
      - Rules & references: rules.md
      - Connectors: connectors.md
  - Verify:
      - Evidence & checks: verification.md
      - Coverage & host checks: coverage.md
  - Maintain:
      - Recovery: recovery.md
      - Development: development.md
      - Models & costs: models.md
      - Publish: publish.md
      - Schema reference: generated/schemas.md
