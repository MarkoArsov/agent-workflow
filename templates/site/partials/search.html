<div class="search-dialog" data-search-dialog hidden>
  <div class="search-dialog__backdrop" data-search-close></div>
  <section class="search-dialog__panel" role="dialog" aria-modal="true" aria-labelledby="search-title">
    <div class="search-dialog__header">
      <label id="search-title" class="sr-only" for="site-search-input">Search documentation</label>
      <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4 4"></path></svg>
      <input id="site-search-input" type="search" autocomplete="off" placeholder="Search documentation" data-search-input>
      <kbd>Esc</kbd>
    </div>
    <p class="search-dialog__status" data-search-status>Type to search the documentation.</p>
    <ol class="search-results" data-search-results></ol>
  </section>
</div>
