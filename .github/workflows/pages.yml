name: Documentation
on:
  push:
    branches: [main]
    paths: ["docs/**", "skills/**", "schemas/**", "templates/site/**", "scripts/**", "mkdocs.yml", "requirements-docs.txt", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/configure-pages@v5
      - run: python -m pip install -r requirements-docs.txt
      - run: python -m mkdocs build --strict
      - run: python scripts/check_links.py site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
