<!doctype html>
<html>
<head><meta charset="utf-8"><link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components.css"><title>SettingRow</title></head>
<body>
<div class="pl-demo" style="display:block"><div class="pl-group" style="max-width:620px">
<div class="pl-setting"><div class="pl-setting__text"><b>Pick up new issues</b><span>Start work on issues labelled plovi.</span></div><input type="checkbox" class="pl-switch" checked aria-label="Pick up new issues"></div>
<div class="pl-setting"><div class="pl-setting__text"><b>Running tasks</b><span>How many agents work at once.</span></div><input class="pl-input pl-input--num" value="4" aria-label="Running tasks"></div>
<div class="pl-setting"><div class="pl-setting__text"><b>Implement with</b><span>Agent and model for the Implement stage.</span></div><select class="pl-select" aria-label="Implement with"><option>Claude Code · Sonnet</option></select></div>
</div></div>
</body>
</html>
