<!doctype html>
<html>
<head><meta charset="utf-8"><link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components.css"><title>StatusIcon</title></head>
<body>
<div class="pl-demo" style="gap:20px;align-items:center"><span style="display:flex;gap:6px;align-items:center"><svg class="pl-si pl-si--ready" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="5.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="1.6 1.85"/></svg><span>Ready</span></span><span style="display:flex;gap:6px;align-items:center"><svg class="pl-si pl-si--planning" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="5.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M7 7V3.5A3.5 3.5 0 0 1 10.5 7Z" fill="currentColor"/></svg><span>Planning</span></span><span style="display:flex;gap:6px;align-items:center"><svg class="pl-si pl-si--building" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="5.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M7 7V3.5A3.5 3.5 0 0 1 7 10.5Z" fill="currentColor"/></svg><span>Building</span></span><span style="display:flex;gap:6px;align-items:center"><svg class="pl-si pl-si--shepherding" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="5.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M7 7V3.5A3.5 3.5 0 1 1 3.5 7Z" fill="currentColor"/></svg><span>Shepherding</span></span><span style="display:flex;gap:6px;align-items:center"><svg class="pl-si pl-si--review" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="5.5" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="7" cy="7" r="3" fill="currentColor"/></svg><span>In review</span></span><span style="display:flex;gap:6px;align-items:center"><svg class="pl-si pl-si--done" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="6.5" fill="currentColor"/><path d="M4.3 7.2 6.1 9 9.7 5.2" style="stroke: var(--surface)" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Done</span></span><span style="display:flex;gap:6px;align-items:center"><svg class="pl-si pl-si--failed" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="6.5" fill="currentColor"/><path d="M4.9 4.9l4.2 4.2M9.1 4.9 4.9 9.1" style="stroke: var(--surface)" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Failed</span></span><span style="display:flex;gap:6px;align-items:center"><svg class="pl-si pl-si--paused" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="5.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M5.6 5v4M8.4 5v4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg><span>Paused</span></span></div>
</body>
</html>
