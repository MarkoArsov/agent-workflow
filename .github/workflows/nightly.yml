name: Nightly
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    name: core (${{ matrix.os }}, ${{ matrix.python }}${{ matrix.shards && format(', batch {0}/{1}', matrix.shard, matrix.shards) || '' }})
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
            jobs: auto
          - os: ubuntu-latest
            python: "3.14"
            jobs: auto
          - os: macos-latest
            python: "3.11"
            jobs: auto
          - os: macos-latest
            python: "3.14"
            jobs: auto
          - os: windows-latest
            python: "3.11"
            shard: 1
            shards: 3
            jobs: 2
          - os: windows-latest
            python: "3.11"
            shard: 2
            shards: 3
            jobs: 2
          - os: windows-latest
            python: "3.11"
            shard: 3
            shards: 3
            jobs: 2
          - os: windows-latest
            python: "3.14"
            shard: 1
            shards: 3
            jobs: 2
          - os: windows-latest
            python: "3.14"
            shard: 2
            shards: 3
            jobs: 2
          - os: windows-latest
            python: "3.14"
            shard: 3
            shards: 3
            jobs: 2
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Run isolated unit tests
        timeout-minutes: 20
        shell: bash
        run: |
          set -o pipefail
          scenario=()
          if [ "${{ matrix.scenario || false }}" = "true" ]; then scenario=(--scenario-results "$RUNNER_TEMP/scenario-results.json"); fi
          python scripts/run_tests.py --shard ${{ matrix.shard || 1 }} --shards ${{ matrix.shards || 1 }} --jobs ${{ matrix.jobs }} --timings "$RUNNER_TEMP/test-timings.json" --results-dir "$RUNNER_TEMP/test-results" --summary "$GITHUB_STEP_SUMMARY" "${scenario[@]}" 2>&1 | tee "$RUNNER_TEMP/tests.log"
      - name: Summarize failure
        if: failure()
        shell: bash
        run: echo 'Unit tests failed. The failing tests are listed above; download the test log artifact for tracebacks and per-test timeout stacks.' >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve test log, worker results and timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tests-${{ matrix.os }}-${{ matrix.python }}-${{ matrix.shard || 1 }}
          path: |
            ${{ runner.temp }}/tests.log
            ${{ runner.temp }}/test-timings.json
            ${{ runner.temp }}/test-results/
          retention-days: 7
      - name: Keep scenario results for the stable-enough gate
        if: always() && matrix.scenario
        uses: actions/upload-artifact@v7
        with:
          name: scenario-results
          path: ${{ runner.temp }}/scenario-results.json
          retention-days: 30
