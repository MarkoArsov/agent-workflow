site_name: Stageway
site_description: A project-owned workflow for coding agents, checked at every stage.
site_url: https://MarkoArsov.github.io/agent-workflow/
repo_url: https://github.com/MarkoArsov/agent-workflow
repo_name: GitHub
edit_uri: edit/main/docs/
theme:
  name: null
  locale: en
  search_index_only: true
  custom_dir: templates/site
extra_css:
  - assets/css/tokens.css
  - assets/css/base.css
  - assets/css/layout.css
  - assets/css/components.css
  - assets/css/content.css
  - assets/css/home.css
extra_javascript:
  - assets/js/site.js
  - assets/js/search.js
extra:
  brand: stageway
  asset_version: stageway-3
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: false
plugins:
  - search
hooks:
  - scripts/docs_hook.py
validation:
  nav:
    omitted_files: warn
  links:
    not_found: warn
    anchors: warn
nav:
  - Start:
      - Overview: index.md
      - The verification gap: why.md
      - Design principles: principles.md
      - Open source: open-source.md
      - Install: install.md
      - Set up your project: setup.md
      - Your first task: first-task.md
  - Use:
      - Task lifecycle: tasks.md
      - Lanes and bugfixes: lanes.md
      - Review and everyday use: everyday.md
      - When a task stops: recovery.md
      - Skills: generated/skills.md
  - Inside:
      - Code map: code-map.md
      - Evidence and checks: verification.md
      - Review and delivery: review.md
      - Cost and models: models.md
  - Configure:
      - Project layout: projects.md
      - Commands and permissions: execution.md
      - Test environments: environments.md
      - Profile reference: profile.md
  - Customize:
      - Skills and stages: customize.md
      - Rules and references: rules.md
      - Connectors: connectors.md
      - Keep the workflow clear: maintaining.md
  - Trust:
      - Checkpoint scorecard: scorecard.md
      - Security boundary: security.md
      - How it's tested: coverage.md
  - Maintain:
      - Update and remove: lifecycle.md
      - Contribute and develop: development.md
      - Publish a release: publish.md
      - Schema reference: generated/schemas.md
