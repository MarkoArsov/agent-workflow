<header class="site-header" data-site-header>
  <div class="site-header__inner">
    <a class="brand" href="{{ '' | url }}" aria-label="plovi overview">
      <img class="brand-dark" src="{{ 'assets/brand/logo.svg' | url }}" alt="plovi" width="94" height="24">
      <img class="brand-light" src="{{ 'assets/brand/logo-light.svg' | url }}" alt="plovi" width="94" height="24">
    </a>
    <nav class="header-links" aria-label="Documentation sections"><a href="{{ 'first-task/' | url }}">Docs</a><a href="{{ 'cli/' | url }}">CLI</a></nav>
    <div class="header-actions">
      <button class="search-trigger" type="button" data-search-open aria-label="Search documentation"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><path d="m16 16 4 4"></path></svg><span>Search docs</span><kbd>/</kbd></button>
      <label class="theme-control"><span class="sr-only">Color theme</span><select data-theme-select aria-label="Color theme"><option value="system">System</option><option value="dark">Dark</option><option value="light">Light</option></select></label>
      <a class="github-link" href="{{ config.repo_url }}" aria-label="GitHub repository">GitHub</a>
      <button class="drawer-trigger" type="button" aria-controls="site-drawer" aria-expanded="false" aria-label="Open documentation menu" data-drawer-open><span></span><span></span><span></span></button>
    </div>
  </div>
</header>
