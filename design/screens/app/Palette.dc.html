<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>plovi ask</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../components.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 100%; height: 900px; background: var(--bg)">
<dc-import name="Main" scenario="ask" theme="{{theme}}" hint-size="100%,900px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() { return { theme: this.props.theme ?? 'dark' }; }
}
</script>
</body>
</html>
