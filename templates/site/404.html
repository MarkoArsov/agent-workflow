{% extends "main.html" %}

{% block body %}
<main id="main-content" class="not-found" tabindex="-1">
  <p class="section-label">404</p>
  <h1>That page is not on this route.</h1>
  <p>Try searching the docs, or return to the overview.</p>
  <p><button class="button button-primary" type="button" data-search-open>Search docs</button> <a class="text-link" href="{{ '' | url }}">Go to overview</a></p>
</main>
{% endblock %}
