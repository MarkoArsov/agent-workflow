<!doctype html>
<html>
<head><meta charset="utf-8"><link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components.css"><title>ScheduleRow</title></head>
<body>
<div style="background:var(--surface);padding:8px 0">
<button class="pl-sched" aria-current="true"><input type="checkbox" class="pl-switch" checked aria-label="factory on"><span class="pl-sched__name"><b>factory</b><span>Builds issues labelled plovi</span></span><span class="pl-sched__cell"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Every 15 min, weekdays 9–19</span><span class="pl-sched__cell"><svg class="pl-si pl-si--done" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="6.5" fill="currentColor"/><path d="M4.3 7.2 6.1 9 9.7 5.2" style="stroke: var(--surface)" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>Picked #160 · 10 min ago</span><span class="pl-sched__cell pl-num">in 5 min</span></button>
<button class="pl-sched"><input type="checkbox" class="pl-switch" checked aria-label="staging-check on"><span class="pl-sched__name"><b>staging-check</b><span>Tests yesterday's deploys on staging</span></span><span class="pl-sched__cell"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Weekdays at 08:00</span><span class="pl-sched__cell"><svg class="pl-si pl-si--failed" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="6.5" fill="currentColor"/><path d="M4.9 4.9l4.2 4.2M9.1 4.9 4.9 9.1" style="stroke: var(--surface)" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>2 failures · today 08:06</span><span class="pl-sched__cell pl-num">Fri 08:00</span></button>
</div>
</body>
</html>
